<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="6" />
  
  <!-- Stylized Kinetiq K & Kinetic Dumbbell Barbell Mark -->
  <g filter="url(#glow)">
    <!-- Central Barbell shaft -->
    <rect x="136" y="240" width="240" height="32" rx="16" fill="url(#primary-grad)" />
    
    <!-- Left Weight Plates -->
    <rect x="120" y="160" width="28" height="192" rx="12" fill="url(#primary-grad)" />
    <rect x="84" y="192" width="24" height="128" rx="8" fill="#38bdf8" opacity="0.9" />
    <rect x="56" y="216" width="18" height="80" rx="6" fill="#38bdf8" opacity="0.7" />

    <!-- Right Weight Plates -->
    <rect x="364" y="160" width="28" height="192" rx="12" fill="url(#primary-grad)" />
    <rect x="404" y="192" width="24" height="128" rx="8" fill="#38bdf8" opacity="0.9" />
    <rect x="438" y="216" width="18" height="80" rx="6" fill="#38bdf8" opacity="0.7" />

    <!-- Dynamic Kinetic Pulse Line intersecting center -->
    <path d="M170 256 L220 256 L240 200 L272 312 L292 256 L342 256" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
